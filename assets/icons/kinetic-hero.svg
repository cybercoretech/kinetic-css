<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS hero card</title>
  <desc id="desc">Fluid gradient hero graphic with the Kinetic mark.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d15"/>
      <stop offset="100%" stop-color="#0d1720"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(98,231,255,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="480.0" height="240.0" rx="15.4" fill="url(#hero-bg)"/>
  <rect width="480.0" height="240.0" rx="15.4" fill="url(#hero-glow)"/>
  <!-- Grid lines -->
  <g stroke="rgba(98,231,255,0.06)" stroke-width="0.8">
    <line x1="0.0" y1="48.0" x2="480.0" y2="48.0"/>
    <line x1="0.0" y1="96.0" x2="480.0" y2="96.0"/>
    <line x1="0.0" y1="144.0" x2="480.0" y2="144.0"/>
    <line x1="0.0" y1="192.0" x2="480.0" y2="192.0"/>
    <line x1="96.0" y1="0.0" x2="96.0" y2="240.0"/>
    <line x1="192.0" y1="0.0" x2="192.0" y2="240.0"/>
    <line x1="288.0" y1="0.0" x2="288.0" y2="240.0"/>
    <line x1="384.0" y1="0.0" x2="384.0" y2="240.0"/>
  </g>
  <!-- Kinetic mark -->
  <g transform="translate(48, 48)">
    <path d="M48 48 V192" fill="none" stroke="url(#hero-accent)" stroke-width="12.8" stroke-linecap="round"/>
    <path d="M48 120 L144 48" fill="none" stroke="url(#hero-accent)" stroke-width="12.8" stroke-linecap="round"/>
    <path d="M48 120 L144 192" fill="none" stroke="url(#hero-accent)" stroke-width="12.8" stroke-linecap="round"/>
    <circle cx="30.7" cy="30.7" r="3.2" fill="#78ff38"/>
    <circle cx="30.7" cy="122.9" r="3.2" fill="#62e7ff"/>
    <circle cx="92.2" cy="30.7" r="3.2" fill="#d18cff"/>
    <circle cx="92.2" cy="122.9" r="3.2" fill="#d18cff"/>
    <circle cx="61.4" cy="76.8" r="4.0" fill="#62e7ff"/>
  </g>
  <!-- Text -->
  <text x="192.0" y="88.0" font-family="'Space Grotesk', sans-serif" font-size="38.4" font-weight="800" fill="#f3f6ff" letter-spacing="-2">KINETIC CSS</text>
  <text x="192.0" y="120.0" font-family="Inter, sans-serif" font-size="12.8" fill="#a2b4c3">Fluid by nature. Responsive by context.</text>
  <text x="192.0" y="140.0" font-family="Inter, sans-serif" font-size="11.2" fill="#718897">No JavaScript. No build step. No dependencies.</text>
  <!-- Badge -->
  <rect x="192.0" y="156.0" width="112.0" height="25.6" rx="10.2" fill="rgba(98,231,255,0.1)" stroke="rgba(98,231,255,0.3)" stroke-width="0.8"/>
  <text x="248.0" y="172.8" font-family="monospace" font-size="9.6" font-weight="600" fill="#62e7ff" text-anchor="middle" letter-spacing="1">v0.2.0</text>
</svg>
