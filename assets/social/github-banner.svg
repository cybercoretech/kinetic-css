<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS GitHub Banner</title>
  <desc id="desc">GitHub repository banner image</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(98,231,255,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg-gradient)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <g stroke="rgba(98,231,255,0.04)" stroke-width="0.8">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>
  <g transform="translate(80, 60)">
    <path d="M64 64 V256" fill="none" stroke="url(#accent-gradient)" stroke-width="16" stroke-linecap="round"/>
    <path d="M64 160 L192 64" fill="none" stroke="url(#accent-gradient)" stroke-width="16" stroke-linecap="round"/>
    <path d="M64 160 L192 256" fill="none" stroke="url(#accent-gradient)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="8" fill="#78ff38"/>
    <circle cx="64" cy="256" r="8" fill="#62e7ff"/>
    <circle cx="192" cy="64" r="8" fill="#d18cff"/>
    <circle cx="192" cy="256" r="8" fill="#d18cff"/>
    <circle cx="128" cy="160" r="10" fill="#62e7ff"/>
  </g>
  <text x="360" y="130" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="#f3f6ff" letter-spacing="-2">KINETIC CSS</text>
  <text x="360" y="185" font-family="system-ui, sans-serif" font-size="24" fill="#a2b4c3">Fluid by nature. Responsive by context.</text>
  <text x="360" y="220" font-family="system-ui, sans-serif" font-size="20" fill="#718897">No JavaScript. No build step. No dependencies.</text>
  <rect x="360" y="245" width="140" height="36" rx="12" fill="rgba(98,231,255,0.12)" stroke="rgba(98,231,255,0.35)" stroke-width="1.5"/>
  <text x="430" y="269" font-family="monospace" font-size="16" font-weight="600" fill="#62e7ff" text-anchor="middle" letter-spacing="1.5">v0.2.0</text>
</svg>