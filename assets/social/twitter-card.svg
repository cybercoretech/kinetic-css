<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Twitter Card</title>
  <desc id="desc">Social media card for Twitter/X sharing</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(98,231,255,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="rgba(98,231,255,0.05)" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <g transform="translate(100, 115)">
    <path d="M96 96 V384" fill="none" stroke="url(#accent-gradient)" stroke-width="24" stroke-linecap="round"/>
    <path d="M96 240 L288 96" fill="none" stroke="url(#accent-gradient)" stroke-width="24" stroke-linecap="round"/>
    <path d="M96 240 L288 384" fill="none" stroke="url(#accent-gradient)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="96" cy="96" r="12" fill="#78ff38"/>
    <circle cx="96" cy="384" r="12" fill="#62e7ff"/>
    <circle cx="288" cy="96" r="12" fill="#d18cff"/>
    <circle cx="288" cy="384" r="12" fill="#d18cff"/>
    <circle cx="192" cy="240" r="16" fill="#62e7ff"/>
  </g>
  <text x="480" y="230" font-family="system-ui, sans-serif" font-size="96" font-weight="800" fill="#f3f6ff" letter-spacing="-3">KINETIC CSS</text>
  <text x="480" y="310" font-family="system-ui, sans-serif" font-size="32" fill="#a2b4c3">Fluid by nature. Responsive by context.</text>
  <text x="480" y="365" font-family="system-ui, sans-serif" font-size="28" fill="#718897">No JavaScript. No build step. No dependencies.</text>
  <rect x="480" y="410" width="200" height="48" rx="16" fill="rgba(98,231,255,0.12)" stroke="rgba(98,231,255,0.35)" stroke-width="2"/>
  <text x="580" y="442" font-family="monospace" font-size="20" font-weight="600" fill="#62e7ff" text-anchor="middle" letter-spacing="2">v0.2.0</text>
</svg>