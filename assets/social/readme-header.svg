<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS README Header</title>
  <desc id="desc">README documentation header image</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(98,231,255,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bg-gradient)"/>
  <rect width="800" height="200" fill="url(#glow)"/>
  <g stroke="rgba(98,231,255,0.03)" stroke-width="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  <g transform="translate(50, 40)">
    <path d="M48 48 V152" fill="none" stroke="url(#accent-gradient)" stroke-width="10" stroke-linecap="round"/>
    <path d="M48 100 L120 48" fill="none" stroke="url(#accent-gradient)" stroke-width="10" stroke-linecap="round"/>
    <path d="M48 100 L120 152" fill="none" stroke="url(#accent-gradient)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="5" fill="#78ff38"/>
    <circle cx="48" cy="152" r="5" fill="#62e7ff"/>
    <circle cx="120" cy="48" r="5" fill="#d18cff"/>
    <circle cx="120" cy="152" r="5" fill="#d18cff"/>
    <circle cx="84" cy="100" r="6" fill="#62e7ff"/>
  </g>
  <text x="220" y="90" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#f3f6ff" letter-spacing="-1.5">KINETIC CSS</text>
  <text x="220" y="125" font-family="system-ui, sans-serif" font-size="16" fill="#a2b4c3">Fluid by nature. Responsive by context.</text>
  <text x="220" y="150" font-family="system-ui, sans-serif" font-size="14" fill="#718897">No JavaScript. No build step. No dependencies.</text>
  <rect x="220" y="165" width="100" height="26" rx="8" fill="rgba(98,231,255,0.1)" stroke="rgba(98,231,255,0.3)" stroke-width="1"/>
  <text x="270" y="183" font-family="monospace" font-size="12" font-weight="600" fill="#62e7ff" text-anchor="middle" letter-spacing="1">v0.2.0</text>
</svg>