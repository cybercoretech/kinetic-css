<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Stat Card - Light</title>
  <desc id="desc">Light theme statistics card with metric and trend</desc>
  <defs>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="12" fill="url(#card-gradient)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">CSS Tokens</text>
  <text x="20" y="75" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#0f172a">50+</text>
  <rect x="20" y="95" width="60" height="24" rx="6" fill="rgba(120,255,56,0.15)"/>
  <text x="50" y="111" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78ff38" text-anchor="middle">Design</text>
  <text x="20" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">system tokens</text>
</svg>