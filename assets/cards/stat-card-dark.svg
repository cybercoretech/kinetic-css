<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Stat Card - Dark</title>
  <desc id="desc">Dark theme statistics card with metric and trend</desc>
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="160" rx="12" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" fill="#a2b4c3">Metric Name</text>
  <text x="20" y="75" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#f3f6ff">42.5K</text>
  <rect x="20" y="95" width="60" height="24" rx="6" fill="rgba(120,255,56,0.15)"/>
  <text x="50" y="111" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78ff38" text-anchor="middle">+12.5%</text>
  <text x="20" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#718897">vs last month</text>
</svg>