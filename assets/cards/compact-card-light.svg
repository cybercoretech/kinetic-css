<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Compact Card - Light</title>
  <desc id="desc">Light theme compact card for dense layouts</desc>
  <defs>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="240" height="100" rx="10" fill="url(#card-gradient)" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="40" cy="50" r="20" fill="rgba(98,231,255,0.1)"/>
  <circle cx="40" cy="50" r="10" fill="none" stroke="url(#accent-gradient)" stroke-width="2.5"/>
  <text x="75" y="45" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Compact Card</text>
  <text x="75" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Short description text</text>
</svg>