<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Regular Card - Light</title>
  <desc id="desc">Light theme regular card</desc>
  <defs>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#card-gradient)" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="20" width="56" height="56" rx="10" fill="rgba(98,231,255,0.1)"/>
  <circle cx="48" cy="48" r="16" fill="none" stroke="url(#accent-gradient)" stroke-width="3"/>
  <text x="20" y="100" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#0f172a">Card Title</text>
  <text x="20" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Brief description of the card</text>
  <text x="20" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">content and its purpose.</text>
  <rect x="20" y="165" width="90" height="28" rx="6" fill="url(#accent-gradient)"/>
  <text x="65" y="183" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Learn</text>
</svg>