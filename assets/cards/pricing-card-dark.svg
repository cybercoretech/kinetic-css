<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Pricing Card - Dark</title>
  <desc id="desc">Dark theme pricing card with tier and features</desc>
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="280" height="280" rx="16" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1"/>
  <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accent-gradient)"/>
  <text x="20" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#f3f6ff">Kinetic Core</text>
  <text x="20" y="85" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#f3f6ff">0KB</text>
  <text x="100" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#a2b4c3">JavaScript</text>
  <line x1="20" y1="110" x2="260" y2="110" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="135" r="4" fill="#78ff38"/>
  <text x="40" y="139" font-family="system-ui, sans-serif" font-size="12" fill="#a2b4c3">Fluid typography</text>
  <circle cx="28" cy="160" r="4" fill="#78ff38"/>
  <text x="40" y="164" font-family="system-ui, sans-serif" font-size="12" fill="#a2b4c3">Container queries</text>
  <circle cx="28" cy="185" r="4" fill="#78ff38"/>
  <text x="40" y="189" font-family="system-ui, sans-serif" font-size="12" fill="#a2b4c3">Density modes</text>
  <circle cx="28" cy="210" r="4" fill="#78ff38"/>
  <text x="40" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#a2b4c3">Modern CSS only</text>
  <rect x="20" y="235" width="240" height="32" rx="8" fill="rgba(98,231,255,0.15)" stroke="rgba(98,231,255,0.4)" stroke-width="1.5"/>
  <text x="140" y="256" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#62e7ff" text-anchor="middle">Install Now</text>
