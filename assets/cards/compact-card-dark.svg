<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Compact Card - Dark</title>
  <desc id="desc">Dark theme compact card for dense layouts</desc>
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="240" height="100" rx="10" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="40" cy="50" r="20" fill="rgba(98,231,255,0.08)"/>
  <path d="M32 36 V64" fill="none" stroke="url(#accent-gradient)" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 50 L52 36" fill="none" stroke="url(#accent-gradient)" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 50 L52 64" fill="none" stroke="url(#accent-gradient)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="2" fill="#78ff38"/>
  <circle cx="32" cy="64" r="2" fill="#62e7ff"/>
  <circle cx="52" cy="36" r="2" fill="#d18cff"/>
  <circle cx="52" cy="64" r="2" fill="#d18cff"/>
  <circle cx="40" cy="50" r="2.5" fill="#62e7ff"/>
  <text x="75" y="45" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#f3f6ff">Fluid Scale</text>
  <text x="75" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#a2b4c3">clamp() interpolation</text>
</svg>