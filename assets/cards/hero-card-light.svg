<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Hero Card - Light</title>
  <desc id="desc">Light theme hero card with gradient accent</desc>
  <defs>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#card-gradient)"/>
  <rect x="0" y="0" width="400" height="4" rx="2" fill="url(#accent-gradient)"/>
  <rect x="24" y="32" width="80" height="80" rx="12" fill="rgba(98,231,255,0.1)"/>
  <path d="M44 48 V96" fill="none" stroke="url(#accent-gradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M44 72 L80 48" fill="none" stroke="url(#accent-gradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M44 72 L80 96" fill="none" stroke="url(#accent-gradient)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="44" cy="48" r="3" fill="#78ff38"/>
  <circle cx="44" cy="96" r="3" fill="#62e7ff"/>
  <circle cx="80" cy="48" r="3" fill="#d18cff"/>
  <circle cx="80" cy="96" r="3" fill="#d18cff"/>
  <circle cx="62" cy="72" r="4" fill="#62e7ff"/>
  <text x="24" y="140" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Density Modes</text>
  <text x="24" y="168" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Switch between compact, comfortable,</text>
  <text x="24" y="188" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">and spacious without rewriting styles.</text>
  <rect x="24" y="208" width="120" height="36" rx="8" fill="url(#accent-gradient)"/>
  <text x="84" y="231" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Try it</text>
</svg>