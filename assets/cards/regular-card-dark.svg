<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">Kinetic CSS Regular Card - Dark</title>
  <desc id="desc">Dark theme regular card</desc>
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1720"/>
      <stop offset="100%" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62e7ff"/>
      <stop offset="50%" stop-color="#78ff38"/>
      <stop offset="100%" stop-color="#d18cff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" rx="12" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="20" width="56" height="56" rx="10" fill="rgba(98,231,255,0.08)"/>
  <circle cx="48" cy="48" r="16" fill="none" stroke="url(#accent-gradient)" stroke-width="3"/>
  <text x="20" y="100" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#f3f6ff">Card Title</text>
  <text x="20" y="125" font-family="system-ui, sans-serif" font-size="13" fill="#a2b4c3">Brief description of the card</text>
  <text x="20" y="145" font-family="system-ui, sans-serif" font-size="13" fill="#a2b4c3">content and its purpose.</text>
  <rect x="20" y="165" width="90" height="28" rx="6" fill="rgba(98,231,255,0.15)" stroke="rgba(98,231,255,0.4)" stroke-width="1"/>
  <text x="65" y="183" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#62e7ff" text-anchor="middle">Learn</text>
</svg>